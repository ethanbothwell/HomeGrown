version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: homegrown_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: homegrown
      POSTGRES_USER: homegrown
      POSTGRES_PASSWORD: homegrown_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homegrown"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin web UI — visit http://localhost:5050
  # Login: admin@homegrown.local / admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: homegrown_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@homegrown.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
